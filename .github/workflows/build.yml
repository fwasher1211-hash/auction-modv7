   name: Build jar
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 21
         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: 9.3.0
         - name: Build
           run: |
             cd "$(dirname "$(find . -path '*auction-mod-donut*' -name build.gradle | head -1)")"
             gradle build
             mkdir -p "$GITHUB_WORKSPACE/out"
             cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
         - uses: actions/upload-artifact@v4
           with:
             name: auctionmod-jar
             path: out/*.jar
